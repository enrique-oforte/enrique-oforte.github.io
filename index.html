<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enrique Ortega-Forte, PhD</title>
    <style>
      :root{--accent:#33758B;--muted:#D0D2D3;--bg:#fbfcfd}
      html,body{height:100%;margin:0;background:var(--bg);color:#111;font-family:Inter,system-ui,Arial,Helvetica,sans-serif}
      .wrap{max-width:720px;margin:6vh auto;padding:28px}
      header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
      .logo{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#2b6b99);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
      h1{margin:0 0 12px 0;font-size:28px;color:var(--accent)}
      p{margin:0 0 12px 0;color:var(--muted);line-height:1.6}
      .btn{display:inline-block;margin-top:8px;padding:10px 14px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
      footer{margin-top:28px;color:var(--muted);font-size:13px}
      @media (max-width:520px){.wrap{padding:20px;margin:4vh auto}h1{font-size:22px}}
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">EOF</div>
        <div>
          <div style="font-weight:800;color:#AA2B75">Enrique Ortega-Forte, PhD</div>
          </div>
      </header>

      <main>
        <h1>Hi there!</h1>
        <p>Welcome to Enrique's website.</p>
        <p>I am a chemical biologist exploring cell processes with chemical tools for therapeutic discovery.</p>

        <p>
          <a class="btn" href="https://orcid.org/0000-0001-8812-4806" target="_blank" rel="noopener noreferrer">Publications</a>
        </p>
      </main>

      <footer>
        © <span id="year"></span> Enrique Oforte
      </footer>
    </div>

    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
